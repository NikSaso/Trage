========================================================= */

#bubble{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:18px;

    color:#20242b;

    border:5px solid #20242b;

    padding:14px 18px;

    box-shadow:
        6px 6px 0 #000;

    display:none;

    z-index:20;
}

#bubble:after{
    content:"";
    position:absolute;
    bottom:-18px;
    left:48px;

    width:18px;
    height:18px;

    background:#fff8df;

    border-right:5px solid #20242b;
    border-bottom:5px solid #20242b;

}

#bubbleTimer{

}

#bubbleTimerFill{

}

========================================================= */

.hpText{

.hpBar{

.hpFill{

#battleBottom{

#battleMessage{

}

.categoryButtons{
    display:grid;

.actionGrid{

    grid-template-columns:repeat(3,1fr);

button{

button:hover{

button:disabled{

function rect(x,y,w,h,color){

    ctx.fillStyle=color;

    ctx.fillRect(
        Math.round(x),
        Math.round(y),
        w,
        h
    );

}


function text(t,x,y,size=8,color="#fff",align="left"){

    ctx.font=
        `bold ${size}px monospace`;

    ctx.fillStyle=color;

    ctx.textAlign=align;

    ctx.fillText(t,x,y);

}

/* =========================================================
   NEAREST NPC
========================================================= */

function nearestNPC(){

    let nearest=null;
    let distance=Infinity;


    for(
        const n of npcs
    ){

        const d=
            Math.hypot(
                n.x-player.x,
                n.y-player.y
            );


        if(d<distance){

            distance=d;
            nearest=n;

        }

    }


    if(distance<30)
        return nearest;


    return null;

}


/* =========================================================
   INTERACTION
========================================================= */

function interact(){

    const npc=
        nearestNPC();


    if(!npc){

        showBubble(
            "SYSTEM",
            "Πλησίασε έναν πελάτη και πάτησε SPACE.",
            3000
        );

        return;

    }


    if(npc.done){

        showBubble(
            npc.name,
            "Τα λέμε αργότερα!",
            2500
        );

        return;

    }


    startBattle(npc);

}


/* =========================================================
   START BATTLE
========================================================= */

function startBattle(npc){

    encounter={

        npc:npc,

        playerHP:player.hp,

        customerHP:npc.hp,

        customerMaxHP:npc.maxHp,

        trust:npc.trust,

        interest:npc.interest,

        turn:"player",

        category:"attack",

        confidence:false,

        combo:false,

        revealed:false,

        selectedInternet:null,

        selectedFixed:false,

        selectedInternational:false,

        saleValue:0,

        escapeChance:0,

        customerMood:0,

        log:"Ο πελάτης περιμένει να ακούσει την πρότασή σου."

    };


    state="battle";


    document.getElementById(
        "battleUI"
    ).style.display="block";


    renderBattle();


    showBubble(
        npc.name,
        randomCustomerLine(npc.type),

}


/* =========================================================
   RANDOM CUSTOMER LINE
========================================================= */

function randomCustomerLine(type){

    const list=
        customerDialogue[type] ||
        customerDialogue.price;


    return list[
        Math.floor(
            Math.random()*list.length
        )
    ];

}

/* =========================================================
   SHOW BUBBLE
========================================================= */

function showBubble(
    name,
    message,
    duration=3000,
    callback=null
){

    clearTimeout(
        bubbleTimeout
    );


    const bubble=
        document.getElementById(
            "bubble"
        );


    document.getElementById(
        "bubbleName"
    ).textContent=
        name;


    document.getElementById(
        "bubbleText"
    ).textContent=
        message;


    const fill=
        document.getElementById(
            "bubbleTimerFill"
        );


    fill.style.transition="none";
    fill.style.width="100%";


    bubble.style.display="block";


    requestAnimationFrame(
        ()=>{

            fill.style.transition=
                `width ${duration}ms linear`;

            fill.style.width="0%";

        }
    );


    bubbleTimeout=
        setTimeout(
            ()=>{

                bubble.style.display=
                    "none";


                if(callback)
                    callback();

            },
            duration
        );

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function useAttack(index){

    if(
        !encounter ||
        encounter.turn!=="player"
    )
        return;


    const attack=
        attacks[index];


    let damage=
        attack.damage+
        Math.floor(
            Math.random()*7
        );


    damage+=
        typeBonus(
            encounter.npc.type,
            attack.type
        );


    if(encounter.confidence){

        damage=
            Math.floor(
                damage*1.5
            );

        encounter.confidence=false;

    }


    if(encounter.combo){

        damage+=15;

        encounter.combo=false;

    }


    damage=Math.max(
        3,
        damage
    );


    encounter.customerHP=
        Math.max(
            0,
            encounter.customerHP-damage
        );


    encounter.log=
        `⚔️ ${attack.name} → -${damage} HP`;


    renderBattle();


    showBubble(
        "ΠΩΛΗΤΗΣ",
        attack.name,
        3000,
        ()=>{

            if(
                encounter &&
                encounter.customerHP<=0
            ){

                winBattle();

            }
            else if(encounter){

                customerAI();

            }

        }
    );

}


/* =========================================================
   TYPE BONUS
========================================================= */

function typeBonus(
    type,
    attackType
){

    let bonus=0;


    if(
        type==="price" &&
        attackType==="price"
    )
        bonus+=10;


    if(
        type==="quality" &&
        attackType==="quality"
    )
        bonus+=12;


    if(
        type==="loyal" &&
        attackType==="relationship"
    )
        bonus+=12;


    if(
        type==="loyal" &&
        attackType==="urgency"
    )
        bonus-=8;


    if(
        type==="quality" &&
        attackType==="price"
    )
        bonus-=5;


    return bonus;

}

/* =========================================================
   CUSTOMER AI
========================================================= */

function customerAI(){

    if(!encounter)
        return;


    encounter.turn="enemy";


    renderBattle();


    setTimeout(
        ()=>{

            if(!encounter)
                return;


            const npc=
                encounter.npc;


            /*
             * LOCAL AI
             *
             * Decision based on:
             * HP
             * Trust
             * Interest
             * Customer type
             */


            let action;


            const hpRatio=
                encounter.customerHP/
                encounter.customerMaxHP;


            const trust=
                encounter.trust;


            const interest=
                encounter.interest;


            if(
                hpRatio<.30 &&
                interest>65
            ){

                action="counter";

            }

            else if(
                hpRatio<.35
            ){

                action="heal";

            }

            else if(
                trust<25 &&
                Math.random()<.35
            ){

                action="escape";

            }

            else if(
                interest>70 &&
                Math.random()<.35
            ){

                action="question";

            }

            else{

                action=
                    aiChooseByType(
                        npc.type
                    );

            }


            executeCustomerAI(
                action
            );

        },
        700
    );

}


/* =========================================================
   AI DECISION BY TYPE
========================================================= */

function aiChooseByType(type){

    const r=
        Math.random();


    if(type==="price"){

        if(r<.45)
            return "counter";

        if(r<.70)
            return "question";

        if(r<.85)
            return "defend";

        return "heal";

    }


    if(type==="quality"){

        if(r<.40)
            return "question";

        if(r<.65)
            return "counter";

        if(r<.85)
            return "defend";

        return "heal";

    }


    if(type==="loyal"){

        if(r<.35)
            return "defend";

        if(r<.65)
            return "question";

        if(r<.82)
            return "counter";

        return "escape";

    }


    return "defend";

}


/* =========================================================
   EXECUTE CUSTOMER AI
========================================================= */

function executeCustomerAI(action){

    if(!encounter)
        return;


    const npc=
        encounter.npc;


    let message=
        randomCustomerLine(
            npc.type
        );


    let damage=0;

    let heal=0;


    if(action==="counter"){

        damage=
            9+
            Math.floor(
                Math.random()*9
            );


        if(
            npc.type==="price"
        )
            damage+=4;


        if(
            npc.type==="loyal"
        )
            damage+=3;


        message=
            customerCounterLine(
                npc.type
            );

    }


    if(action==="defend"){

        heal=
            7+
            Math.floor(
                Math.random()*7
            );


        message=
            customerDefenseLine(
                npc.type
            );

    }


    if(action==="heal"){

        heal=
            12+
            Math.floor(
                Math.random()*8
            );


        message=
            customerHealLine(
                npc.type
            );

    }


    if(action==="question"){

        encounter.interest=
            Math.min(
                100,
                encounter.interest+6
            );


        encounter.trust=
            Math.min(
                100,
                encounter.trust+3
            );


        message=
            customerQuestionLine(
                npc.type
            );

    }


    if(action==="escape"){

        encounter.escapeChance+=15;


        message=
            "🚪 «Εντάξει, ευχαριστώ πολύ. Πρέπει να φύγω.»";


        if(
            Math.random()<
            .35+
            encounter.escapeChance/100
        ){

            encounter.turn="lost";

            encounter.log=
                "🚪 Ο πελάτης έφυγε!";


            renderBattle();


            showBubble(
                npc.name,
                message,
                3000,
                ()=>loseBattle()
            );


            return;

        }

    }


    encounter.customerHP=
        Math.min(
            encounter.customerMaxHP,
            encounter.customerHP+heal
        );


    encounter.playerHP=
        Math.max(
            0,
            encounter.playerHP-damage
        );


    encounter.log=
        `${npc.name}: ${message}`;


    encounter.turn="player";


    renderBattle();


    showBubble(
        npc.name,
        message,
        3000,
        ()=>{

            if(
                encounter &&
                encounter.playerHP<=0
            ){

                loseBattle();

            }
            else if(encounter){

                encounter.turn="player";

                renderBattle();

            }

        }
    );

}

/* =========================================================
   WIN
========================================================= */

function winBattle(){

    if(!encounter)
        return;


    const npc=
        encounter.npc;


    npc.done=true;

    npc.hp=0;


    const xpGain=
        25+
        Math.floor(
            encounter.saleValue/3
        );


    const moneyGain=
        25+
        encounter.saleValue;


    player.money+=
        moneyGain;


    player.xp+=
        xpGain;


    player.stats.sales++;


    if(encounter.selectedInternet)
        player.stats.products++;


    if(encounter.selectedFixed)
        player.stats.products++;


    if(encounter.selectedInternational)
        player.stats.products++;


    let leveled=false;


    if(player.xp>=100){

        player.xp-=100;

        player.level++;

        player.maxHp+=10;

        player.hp=
            player.maxHp;

        leveled=true;

    }
    else{

        player.hp=
            Math.min(
                player.maxHp,
                encounter.playerHP
            );

    }


    encounter.turn="won";

    encounter.log=
        "🏆 Η ΠΩΛΗΣΗ ΚΛΕΙΣΤΗ!";


    renderBattle();


    let saleText=
        "ΠΩΛΗΣΗ ΟΛΟΚΛΗΡΩΘΗΚΕ!";


    if(leveled)
        saleText+=
            " LEVEL UP!";


    showBubble(
        "SYSTEM",
        saleText,
        3000,
        ()=>{

            showSaleSummary(
                moneyGain,
                xpGain
            );

        }
    );

}

/* =========================================================
   MOVEMENT
========================================================= */

function update(dt){

    if(state!=="world")
        return;


    let dx=0;
    let dy=0;


    if(
        keys["arrowleft"] ||
        keys["a"]
    )
        dx--;


    if(
        keys["arrowright"] ||
        keys["d"]
    )
        dx++;


    if(
        keys["arrowup"] ||
        keys["w"]
    )
        dy--;


    if(
        keys["arrowdown"] ||
        keys["s"]
    )
        dy++;


    if(
        dx!==0 ||
        dy!==0
    ){

        const length=
            Math.hypot(
                dx,
                dy
            );


        dx/=length;
        dy/=length;


        player.x+=
            dx*
            player.speed*
            dt;


        player.y+=
            dy*
            player.speed*
            dt;

    }


    player.x=
        Math.max(
            10,
            Math.min(
                W-10,
                player.x
            )
        );


    player.y=
        Math.max(
            75,
            Math.min(
                H-10,
                player.y
            )
        );

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time){

    const dt=
        Math.min(
            .05,
            (time-lastTime)/1000 || 0
        );


    lastTime=time;


    update(dt);


    if(state==="world"){

        drawWorld();

    }


    if(state==="battle"){

        drawBattleScene();

    }


    requestAnimationFrame(loop);

}


requestAnimationFrame(loop);
