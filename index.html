<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D2D Hunter — v0.3</title>

<style>

*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07101b;
  color:#eef6ff;
  font-family:Arial,Helvetica,sans-serif;















}

canvas{
  display:block;






























}

#game{
  position:fixed;
  inset:0;























}

#hud{
  position:fixed;
  left:16px;
  top:16px;
  width:300px;
  z-index:10;
}

.panel{
  background:rgba(5,13,24,.88);
  border:1px solid rgba(255,255,255,.11);
  border-radius:15px;
  padding:13px;
  box-shadow:0 15px 45px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;






}

.sub{
  color:#7389a5;
  font-size:10px;
  margin-top:2px;




}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:12px;




}

.bar{
  height:6px;
  margin-top:5px;
  background:#17263a;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
}

.hp{background:#5be4a3}
.sta{background:#54c9ff}
.xp{background:#bd85ff}
.heat{background:#ff756e}




#bonus{
  margin-top:9px;
  color:#71e5ad;
  font-weight:900;
}

#mission{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  width:370px;
  z-index:10;
  text-align:center;



}

#missionTitle{
  font-weight:900;



}

#missionText{
  margin-top:4px;
  font-size:12px;
  color:#aebed2;
}

#buttons{
  position:fixed;
  right:16px;
  top:16px;
  z-index:20;
  display:flex;
  gap:6px;
}

button{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(7,18,32,.9);
  color:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;







}

button:hover{
  background:#18304a;
}

#minimap{
  position:fixed;
  right:16px;
  bottom:16px;
  width:210px;
  height:150px;
  background:#07111d;
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  z-index:10;
}

#location{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(5,13,24,.85);
  border:1px solid rgba(255,255,255,.1);
  padding:9px 15px;
  border-radius:12px;
  font-size:12px;
  color:#b9c9db;
}

#toast{
  position:fixed;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  background:rgba(5,13,24,.96);
  border:1px solid rgba(255,255,255,.13);
  padding:11px 17px;
  border-radius:12px;
  z-index:30;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  font-weight:700;
}

#center{
  position:fixed;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:50;
  pointer-events:none;
  opacity:0;
  transition:.2s;
}

#center h1{
  margin:0;
  font-size:43px;
  text-shadow:0 10px 35px black;
}

#center p{
  color:#b7c7da;
}

#help{
  position:fixed;
  left:16px;
  bottom:16px;
  z-index:10;
  font-size:10px;
  color:#6e849f;
}

@media(max-width:800px){
  #mission{display:none}
  #hud{width:235px}
  #help{display:none}

}

</style>
</head>

<body>

<canvas id="game"></canvas>
<canvas id="minimap"></canvas>
